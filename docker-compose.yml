services:
  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_PASSWORD:?set MARIADB_PASSWORD in .env}
      MARIADB_DATABASE: ${MARIADB_DATABASE:-testdb}
    volumes:
      - db-data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  app:
    build: ./backend
    restart: unless-stopped
    environment:
      MARIADB_HOST: db
      MARIADB_PORT: 3306
      MARIADB_USER: root
      MARIADB_PASSWORD: ${MARIADB_PASSWORD}
      MARIADB_DATABASE: ${MARIADB_DATABASE:-testdb}
      PORT: 3000
    depends_on:
      - db

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "8080:80"

volumes:
  db-data:
